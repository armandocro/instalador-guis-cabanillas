name: security-detect-secrets

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Detect Secrets
        uses: inditex/detect-secrets-action@v1
        continue-on-error: true
